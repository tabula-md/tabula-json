name: Verify and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate App Engine config
        env:
          TABULA_JSON_ALLOWED_ORIGINS: ${{ vars.TABULA_JSON_ALLOWED_ORIGINS }}
          TABULA_JSON_GCS_BUCKET: ${{ vars.TABULA_JSON_GCS_BUCKET }}
          TABULA_JSON_GCS_PREFIX: ${{ vars.TABULA_JSON_GCS_PREFIX }}
          TABULA_JSON_GLOBAL_READ_RATE_LIMIT_PER_MINUTE: ${{ vars.TABULA_JSON_GLOBAL_READ_RATE_LIMIT_PER_MINUTE }}
          TABULA_JSON_GLOBAL_WRITE_RATE_LIMIT_PER_MINUTE: ${{ vars.TABULA_JSON_GLOBAL_WRITE_RATE_LIMIT_PER_MINUTE }}
          TABULA_JSON_MAX_INSTANCES: ${{ vars.TABULA_JSON_MAX_INSTANCES }}
          TABULA_JSON_MAX_PAYLOAD_BYTES: ${{ vars.TABULA_JSON_MAX_PAYLOAD_BYTES }}
          TABULA_JSON_READ_RATE_LIMIT_PER_MINUTE: ${{ vars.TABULA_JSON_READ_RATE_LIMIT_PER_MINUTE }}
          TABULA_JSON_STORAGE_DRIVER: ${{ vars.TABULA_JSON_STORAGE_DRIVER }}
          TABULA_JSON_WRITE_RATE_LIMIT_PER_MINUTE: ${{ vars.TABULA_JSON_WRITE_RATE_LIMIT_PER_MINUTE }}
        run: node scripts/write-app-yaml.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to App Engine
        uses: google-github-actions/deploy-appengine@v3
        with:
          deliverables: app.yaml
          project_id: ${{ vars.GCP_PROJECT_ID }}
          promote: true

      - name: Smoke production
        env:
          TABULA_JSON_SMOKE_ORIGIN: ${{ vars.TABULA_JSON_SMOKE_ORIGIN }}
          TABULA_JSON_SMOKE_URL: ${{ vars.TABULA_JSON_SMOKE_URL }}
        run: |
          : "${TABULA_JSON_SMOKE_ORIGIN:?TABULA_JSON_SMOKE_ORIGIN is required}"
          : "${TABULA_JSON_SMOKE_URL:?TABULA_JSON_SMOKE_URL is required}"
          npm run smoke:production
