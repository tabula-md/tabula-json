name: Verify and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to App Engine
        uses: google-github-actions/deploy-appengine@v3
        with:
          deliverables: app.yaml
          project_id: ${{ vars.GCP_PROJECT_ID }}
          promote: true

      - name: Smoke production
        env:
          TABULA_JSON_SMOKE_ORIGIN: ${{ vars.TABULA_JSON_SMOKE_ORIGIN }}
          TABULA_JSON_SMOKE_URL: ${{ vars.TABULA_JSON_SMOKE_URL }}
        run: |
          TABULA_JSON_SMOKE_ORIGIN="${TABULA_JSON_SMOKE_ORIGIN:-https://tabula.md}" \
          TABULA_JSON_SMOKE_URL="${TABULA_JSON_SMOKE_URL:-https://json.tabula.md}" \
          npm run smoke:production
